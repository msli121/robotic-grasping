# --- 1. 核心实体中英文映射 ---
# 闭集模型训练时使用的类别，指令解析的核心
class_map:
  爱心方块: love square
  梯形方块: trapezoid square
  正方方块: square block
  三角方块: triangle square
  五边形方块: pentagon square
  菱形方块: rhombus square
  十字方块: cross square
  六边形方块: hexagon square
  圆柱体: cylinder
  五角星: five-pointed star
  中性笔: ballpoint pen
  水果刀: fruit knife
  折叠小刀: folding knife
  内六角扳手: hex key
  药膏: ointment
  打火机: lighter
  U盘: usb drive
  激光笔: laser pointer
  电池: battery
  胶带: tape
  水平仪: level
  螺丝刀: screwdriver
  铰链: hinge
  螺丝: screw
  螺母: nut
  弹簧: spring
  木夹: wooden clip
  牙刷: toothbrush
  电子开关: electronic switch
  马克笔: marker pen
  2B铅笔: 2b pencil

# --- 2. 可识别的视觉属性 ---
# 用于开放词汇模式的 Prompt 构建，以及闭集模式的后处理筛选
attributes:
  color:
    红色: red
    黑色: black
    绿色: green
    蓝色: blue
    黄色: yellow
    白色: white
    银色: silver
  material:
    金属: metallic
    塑料: plastic
    木制: wooden

# --- 3. 可识别的约束条件 ---
# 用于后处理模块进行决策
constraints:
  size:
    最大: largest
    最小: smallest
    最长: longest
    最短: shortest
  position:
    最近: nearest
    最远: farthest
    最左: leftmost
    最左边: leftmost
    最右: rightmost
    最右边: rightmost
    最上: topmost
    最上面: topmost
    最下: bottommost
    最下面: bottommost
    中间: middle
